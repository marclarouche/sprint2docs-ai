[build-system]
requires = ["setuptools>=75,<86"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint2docs-ai"
version = "0.1.0"
description = "Local, source-preserving release artifact ingestion"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit>=1.50,<2", "pydantic>=2.12,<3", "PyYAML>=6.0.3,<7"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML>=6,<7", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/sprint2docs"]
strict = true
